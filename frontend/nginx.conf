daemon off;
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr notice;

env BACKEND_URL;
env AI_API_URL;
env AUTHENTICATION_ALLOW_EMAIL_LOGIN;
env AUTHENTICATION_IDENTITY_PROVIDERS;
env AUTHENTICATION_SEND_USER_EMAIL_AS_HEADER;
env GOOGLE_OAUTH_CLIENT_ID;
env AI_COPILOT_ENABLED;
env AI_COPILOT_DEFAULT_COPILOT;
env AI_COPILOT_DOCUMENTATION_LINKS;
env AI_COPILOT_AI_ENHANCEMENTS;
env AI_COPILOT_SAVE_SKILL_FROM_CHAT;
env AI_SHOW_CUSTOM_COPILOT_KEY;
env UI_SHOW_COMPANION_MCP_MODE;
env UI_SHOW_MINIMIZE_WIDGET;
env UI_SHOW_EXTERNAL_DOCUMENTATION_LINKS;
env UI_SHOW_HELP_DOCUMENTATION;
env UI_SHOW_CHANGELOG;
env UI_SHOW_COPILOT_SWITCHER;
env UI_SHOW_REMOVE_FROM_ORG;
env UI_DEFAULT_THEME;
env ALLOW_HTML_JS_EXECUTION;
env DOCS_URL;
env SUPPORT_EMAIL;
env WL_NAME;
env WL_LOGIN_IMAGE;
env WL_LEFT_SIDEBAR_LOGO;
env WL_LEFT_SIDEBAR_LOGO_DARK;
env WL_FAVICON;
env WL_DESCRIPTION;
env WL_KEYWORDS;
env WL_STYLESHEET;
env CSP_EXTRA_SOURCES;
env CSP_REPORT_ONLY;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  js_path /etc/nginx/njs/;
  js_import app_config from app-config.js;
  js_set $content_security_policy app_config.contentSecurityPolicy;
  js_set $content_security_policy_report_only app_config.contentSecurityPolicyReportOnly;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $content_security_policy always;
    add_header Content-Security-Policy-Report-Only $content_security_policy_report_only always;

    location = /health {
      access_log off;
      default_type application/json;
      js_content app_config.healthz;
    }

    location = /healthz {
      access_log off;
      default_type application/json;
      js_content app_config.healthz;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~ \.mjs$ {
      types {}
      default_type text/javascript;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy $content_security_policy always;
      add_header Content-Security-Policy-Report-Only $content_security_policy_report_only always;
    }

    location = /config.js {
      default_type application/javascript;
      add_header Cache-Control "no-cache";
      add_header Content-Security-Policy $content_security_policy always;
      add_header Content-Security-Policy-Report-Only $content_security_policy_report_only always;
      js_content app_config.configJs;
    }
  }
}
