name: Agent Node

on:
  workflow_call:
    outputs:
      image:
        description: The finos-node image, by tag and digest.
        value: ${{ jobs.node.outputs.image }}

permissions:
  contents: read
  packages: read

jobs:
  node:
    name: Node for the agent's images
    runs-on: ubuntu-latest
    env:
      RELEASE: "26.12.1-3@sha256:41118ae12c0c038f04f6ccb2d9d8b4c16a86c1d7cd5bbc5ecd67e6c8f31deece"
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the release is there
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finos-node:$RELEASE"
          docker manifest inspect "$image" > /dev/null
          echo "image=$image" >> "$GITHUB_OUTPUT"
